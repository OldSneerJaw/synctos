version: 2
updates:

  # Synctos project dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
    versioning-strategy: increase

  # Actions used in GitHub Workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
